                    </div>
                `
            },

            victory: {
                title: "进化胜利！",
                content: `
                    <div class="scene">
                        <div class="outcome success" style="text-align:center;">
                            <h2>🎉 进化胜利！</h2>
                            <p>你成功度过所有危机，破壳成为第一只羊膜卵动物！</p>
                            <p>羊膜卵结构已永久写入你的基因</p>
                        </div>

                        <div class="knowledge">
                            <h3>◆ 羊膜卵核心知识点总结 ◆</h3>
                            <ul>
                                <li><strong>卵壳</strong>：物理防护、防止水分蒸发和气体交换通道</li>
                                <li><strong>尿囊</strong>：呼吸器官+废物储存室</li>
                                <li><strong>羊膜</strong>：私有水环境（胚胎的"私人泳池"）</li>
                                <li><strong>卵黄囊</strong>：能量银行（营养储备）</li>
                                <li><strong>绒毛膜</strong>：外层保护膜</li>
                            </ul>
                            <p>💡 进化意义：羊膜卵在脊椎动物演化史上的意义：</p>
                            <ol>
                                <li>体内受精，受精不必借助水作为介质。</li>
                                <li>羊膜卵可以产在陆地上，并在陆地上孵化。</li>
                                <li>胚胎悬浮在羊水中，使胚胎在自身的水域中发育，环境更稳定，既避免了陆地干燥的威胁，又可减少震动，防止机械损伤。</li>
                            </ol>
                        </div>

                        <div style="text-align:center; margin-top:30px;">
                            <a class="restart" onclick="resetGame()">重新开始游戏</a>
                        </div>
                    </div>
                `
            },

            failure: {
                title: "进化失败",
                content: `
                    <div class="scene">
                        <div class="outcome failure" style="text-align:center;">
                            <h2>💔 进化失败...</h2>
                            <p>你的羊膜卵结构未能适应陆地环境</p>
                        </div>

                        <div class="knowledge">
                            <h3>🔍 失败原因分析：</h3>
                            <p>羊膜卵必须同时解决以下问题才能陆地生存：</p>
                            <ol>
                                <li>防止脱水（羊膜+卵壳）</li>
                                <li>气体交换（尿囊+卵壳气孔）</li>
                                <li>废物处理（尿酸结晶）</li>
                                <li>营养供应（卵黄囊）</li>
                                <li>物理防护（钙质卵壳）</li>
                            </ol>
                        </div>

                        <div style="text-align:center; margin-top:30px;">
                            <a class="restart" onclick="resetGame()">重新进化</a>
                        </div>
                    </div>
                `
            }
        };

        // 加载场景函数
        function loadScene(sceneId) {
            gameState.currentScene = sceneId;
            gameState.selectedChoices = []; // 重置已选选项
            gameState.answerDisplayed = false; // 重置答案显示状态
            document.getElementById("game-container").innerHTML = `
                <h1>🐣 羊膜卵生存挑战 🥚</h1>
                ${scenes[sceneId].content}
            `;

            // 更新页面标题
            document.title = scenes[sceneId].title + " - 羊膜卵生存挑战";
        }

        // 选择选项
        function selectChoice(sceneNumber, choice) {
            const isMultiChoice = [1, 2, 4].includes(sceneNumber); // 场景1、2、4允许多选
            
            // 获取所有选项元素
            const choices = document.querySelectorAll('.choices .choice');
            
            if (isMultiChoice) {
                // 多选场景：切换选中状态
                const choiceIndex = gameState.selectedChoices.findIndex(c => c === choice);
                if (choiceIndex !== -1) {
                    gameState.selectedChoices.splice(choiceIndex, 1);
                    choices[choice - 1].classList.remove('selected');
                } else {
                    gameState.selectedChoices.push(choice);
                    choices[choice - 1].classList.add('selected');
                }
            } else {
                // 单选场景：只能选一个
                gameState.selectedChoices = [choice];
                
                // 更新UI显示
                choices.forEach((c, index) => {
                    if (index === choice - 1) {
                        c.classList.add('selected');
                    } else {
                        c.classList.remove('selected');
                    }
                });
            }
            
            // 无论单选多选，只要有选择就显示下一步按钮
            document.querySelector('.next-btn').style.display = 'inline-block';
        }

        // 验证选项
        function validateChoices(sceneNumber) {
            const correctAnswers = gameState.sceneAnswers[sceneNumber];
            let isCorrect = true;
            
            // 检查是否选择了所有正确答案且没有选择错误答案
            if (gameState.selectedChoices.length !== correctAnswers.length) {
                isCorrect = false;
            } else {
                for (const choice of gameState.selectedChoices) {
                    if (!correctAnswers.includes(choice)) {
                        isCorrect = false;
                        break;
                    }
                }
            }
            
            // 根据选择结果显示相应场景
            if (isCorrect) {
                if (sceneNumber === 5) {
                    loadScene('victory');
                } else {
                    loadScene(`scene${sceneNumber}_outcome_success`);
                }
            } else {
                if (sceneNumber === 5) {
                    loadScene('scene5_outcome_failure');
                } else {
                    loadScene(`scene${sceneNumber}_outcome_failure`);
                }
            }
        }

        // 显示答案
        function showAnswer(sceneNumber) {
            // 显示答案内容
            const answerContent = document.getElementById(`answer-content-${sceneNumber}`);
            if (answerContent) {
                answerContent.style.display = 'block';
            }
            
            // 显示继续前行按钮
            const continueBtn = document.querySelector('.continue-btn');
            if (continueBtn) {
                continueBtn.style.display = 'inline-block';
            }
            
            // 隐藏查看答案按钮
            const answerBtn = document.querySelector('.answer-btn');
            if (answerBtn) {
                answerBtn.style.display = 'none';
            }
            
            // 标记答案已显示
            gameState.answerDisplayed = true;
        }

        // 重置游戏
        function resetGame() {
            gameState.currentScene = "start";
            gameState.selectedChoices = [];
            loadScene("start");
        }

        // 初始化游戏
        loadScene("start");
    </script>
</body>
